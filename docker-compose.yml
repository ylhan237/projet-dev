services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agenthub-postgres
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    ports:
      - "6379:6379"

  frontend:
    image: node:22-alpine
    container_name: agenthub-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
      - agent-orchestrator
      - knowledge-service
      - action-service

  api-gateway:
    image: eclipse-temurin:21-jdk
    container_name: agenthub-api-gateway
    working_dir: /workspace
    command: sh -c "./mvnw spring-boot:run"
    volumes:
      - ./apps/api-gateway:/workspace
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  agent-orchestrator:
    image: python:3.12-slim
    container_name: agenthub-agent-orchestrator
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    volumes:
      - ./apps/agent-orchestrator:/workspace
    ports:
      - "8001:8001"

  knowledge-service:
    image: python:3.12-slim
    container_name: agenthub-knowledge-service
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"
    volumes:
      - ./apps/knowledge-service:/workspace
    ports:
      - "8002:8002"

  action-service:
    image: eclipse-temurin:21-jdk
    container_name: agenthub-action-service
    working_dir: /workspace
    command: sh -c "./mvnw spring-boot:run"
    volumes:
      - ./apps/action-service:/workspace
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
