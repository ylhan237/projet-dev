apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenthub-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ylhan237/projet-dev.git
    targetRevision: main
    path: deploy/helm/agenthub
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agenthub-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
